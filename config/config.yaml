emby_url: http://127.0.0.1:28096
emby_api_key_file: /run/secrets/emby_api_key
allowed_path: /Media
database_path: /data/worker.db
timezone: Asia/Taipei
schedule: "0 3 * * *"
target_seconds: 45
output_bitrate: 192k

limits:
  bootstrap_attempts: 0
  regular_attempts: 100
  regular_successes: 25
  network_concurrency: 2
  media_concurrency: 1

providers:
  enabled:
    - animethemes
    - themerrdb
    - plex_tv
    - archive
    - televisiontunes
    - tunefind
    - youtube
    - bilibili
    - netease
    - qqmusic
  timeout_seconds: 30
  threshold: 75
  cookies:
    youtube: /run/secrets/youtube.cookies.txt
    bilibili: /run/secrets/bilibili.cookies.txt
    netease: /run/secrets/netease.cookies.txt
    qqmusic: /run/secrets/qqmusic.cookies.txt

backoff:
  not_found_days: 30
  low_score_days: 7
  network_hours: 6

refresh:
  full_scan_after_scheduled_run: true
  library_scan_timeout_seconds: 7200
  task_poll_seconds: 10
